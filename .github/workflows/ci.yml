name: CI

# Cloud Run owns deployment (it builds the root Dockerfile itself on every push
# to main). This workflow is the gate in front of that: it has to pass before a
# pull request can merge into develop or main, so a red build never reaches the
# deploy trigger.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        # NEXT_PUBLIC_* are inlined at build time. These are throwaway values so
        # the production build can run without exposing real project keys; the
        # anon key is a public value in any case, but CI has no reason to hold one.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds exactly what Cloud Run will build, so a broken Dockerfile fails
      # here instead of halfway through a deploy. Not pushed anywhere.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  schema:
    name: Database schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Stub the parts of Supabase that plain Postgres lacks
        # schema.sql references auth.users, auth.uid(), auth.jwt() and the
        # `authenticated` / `anon` roles. Supabase provisions all of them; a bare
        # Postgres does not, so stand up the minimum the file needs to compile.
        # (The realtime publication is already skipped gracefully by schema.sql.)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f - <<'SQL'
          create schema if not exists auth;

          do $$ begin create role anon nologin;          exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;

          create table if not exists auth.users (
            id                 uuid primary key,
            email              text,
            raw_user_meta_data jsonb not null default '{}'::jsonb
          );

          create or replace function auth.uid() returns uuid
            language sql stable as $$ select null::uuid $$;

          create or replace function auth.jwt() returns jsonb
            language sql stable as $$ select '{}'::jsonb $$;
          SQL

      - name: Apply schema.sql twice
        # Once proves it is valid SQL. Twice proves it is idempotent — which is
        # the whole promise of shipping one schema file instead of ordered
        # migrations, and the thing most likely to quietly regress.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/schema.sql
