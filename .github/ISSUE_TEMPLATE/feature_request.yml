name: Feature request
description: Suggest something Sprintly should do
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Several features already have tables in `supabase/schema.sql` but no UI —
        docs, channel messaging, email invites, the availability editor. If yours
        is one of those, say so; it's mostly frontend work and a good place to start.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        The situation you're in, not the solution. "I can't tell who is
        overloaded before the sprint starts" is more useful than "add a chart".
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Including how you work around it today.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Board / tasks
        - Docs
        - Messaging / channels
        - Time tracking & workload
        - Workspaces, members & roles
        - Notifications
        - API
        - Deployment & self-hosting
        - Other
    validations:
      required: true

  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - label: I'd be willing to open a pull request for this
          required: false
