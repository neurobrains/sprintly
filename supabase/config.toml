# Supabase CLI config for local development (`supabase start`).
project_id = "sprintly"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# The whole schema lives in one file rather than a migrations directory, so
# `supabase start` / `supabase db reset` applies it as the seed.
[db.seed]
enabled = true
sql_paths = ["./schema.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = false
enable_confirmations = false

# Google is the only sign-in method. Export GOOGLE_CLIENT_ID and
# GOOGLE_SECRET before `supabase start`.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[realtime]
enabled = true
