# Supabase CLI config for local development (`supabase start`).
project_id = "sprintly"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# The whole schema lives in one file rather than a migrations directory, so
# `supabase start` / `supabase db reset` applies it as the seed.
[db.seed]
enabled = true
sql_paths = ["./schema.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Email + password is the only sign-in method.
[auth.email]
enable_signup = true
# Off locally: the CLI's inbox is Inbucket on :54324, and having to fish a link
# out of it on every test signup is friction with no security value on a
# throwaway database. Turn it ON for any deployment reachable from the internet,
# or anyone can register an address they do not own.
enable_confirmations = false
double_confirm_changes = true
min_password_length = 8

[realtime]
enabled = true
